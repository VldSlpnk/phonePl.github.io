<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Сканер номеров</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/tesseract.js@5.0.0/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --panel: #111827;
      --panel-2: #172033;
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(255,255,255,.12);
      --primary: #38bdf8;
      --primary-2: #0284c7;
      --good: #22c55e;
      --warn: #f59e0b;
      --danger: #fb7185;
      --shadow: 0 14px 40px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .camera-wrap {
      position: relative;
      min-height: 42vh;
      background: #020617;
      overflow: hidden;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: var(--shadow);
    }

    video {
      width: 100%;
      height: 100%;
      min-height: 42vh;
      object-fit: cover;
      display: block;
      background: #020617;
    }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      background: radial-gradient(circle at top, #1e293b 0%, #020617 70%);
    }

    .camera-placeholder.hidden { display: none; }

    .camera-placeholder .icon {
      font-size: 44px;
      margin-bottom: 12px;
    }

    .camera-placeholder .title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .camera-placeholder .hint {
      max-width: 330px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .scan-band {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 34%;
      height: 34%;
      border: 2px solid rgba(56, 189, 248, .75);
      border-radius: 18px;
      box-shadow: 0 0 0 999px rgba(0,0,0,.12);
      pointer-events: none;
      display: none;
    }

    .scan-band.active { display: block; }

    .status-chip {
      position: absolute;
      left: 12px;
      top: calc(12px + env(safe-area-inset-top));
      max-width: calc(100% - 92px);
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(2, 6, 23, .72);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .floating-camera-btn {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      font-size: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      flex: initial;
      padding: 0;
    }

    .content {
      flex: 1;
      overflow: auto;
      padding: 16px 14px calc(14px + env(safe-area-inset-bottom));
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .title-block h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
    }

    .counter {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 12px;
      color: #dbeafe;
      background: rgba(56, 189, 248, .12);
      border: 1px solid rgba(56, 189, 248, .25);
    }

    .numbers {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .empty {
      border: 1px dashed rgba(148, 163, 184, .4);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,.03);
    }

    .phone-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .phone-index {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(56, 189, 248, .12);
      color: #bae6fd;
      font-weight: 700;
      font-size: 13px;
      flex: 0 0 auto;
    }

    .phone-number {
      flex: 1;
      font-size: 22px;
      letter-spacing: .8px;
      font-weight: 750;
      white-space: nowrap;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      font-size: 16px;
      padding: 0;
      flex: 0 0 auto;
      cursor: pointer;
    }

    .icon-btn.danger { color: var(--danger); }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 8px;
    }

    .actions .send { grid-column: 1 / -1; }

    button {
      border: 0;
      border-radius: 16px;
      padding: 13px 12px;
      font-weight: 800;
      font-size: 15px;
      color: var(--text);
      background: var(--panel-2);
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
    }

    .secondary {
      background: var(--panel-2);
      border: 1px solid var(--line);
    }

    .danger-btn {
      color: #fecdd3;
      background: rgba(251, 113, 133, .12);
      border: 1px solid rgba(251, 113, 133, .24);
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      display: none;
      background: rgba(2, 6, 23, .94);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(14px);
      padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
      box-shadow: 0 -16px 50px rgba(0,0,0,.45);
    }

    .sheet.visible { display: block; }

    .sheet-inner {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
    }

    .sheet-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 9px;
    }

    .phone-input {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 16px;
      padding: 14px;
      font-size: 22px;
      letter-spacing: 1px;
      outline: none;
      margin-bottom: 10px;
    }

    .sheet-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="camera-wrap" id="cameraWrap">
      <video id="video" autoplay playsinline muted></video>

      <div class="camera-placeholder" id="cameraPlaceholder">
        <div class="icon">📷</div>
        <div class="title">Камера выключена</div>
        <div class="hint">Нажми кнопку камеры справа снизу. После разрешения доступ к камере не будет запрашиваться каждый раз, пока браузер/Telegram помнит разрешение.</div>
      </div>

      <div class="scan-band" id="scanBand"></div>
      <div class="status-chip" id="status">Готово к запуску</div>
      <button class="floating-camera-btn" id="cameraBtn" type="button">📷</button>
    </section>

    <section class="content">
      <div class="top-row">
        <div class="title-block">
          <h1>Отсканированные номера</h1>
          <div class="counter" id="counter">0 номеров</div>
        </div>
        <div class="pill" id="modePill">ожидание</div>
      </div>

      <div class="numbers" id="numbersList"></div>

      <div class="actions">
        <button class="secondary" id="manualBtn" type="button">+ Добавить</button>
        <button class="danger-btn" id="clearBtn" type="button">Очистить</button>
        <button class="primary send" id="sendBtn" type="button" disabled>Отправить в чат</button>
      </div>
    </section>
  </main>

  <div class="sheet" id="editSheet">
    <div class="sheet-inner">
      <div class="sheet-title" id="sheetTitle">Добавить номер</div>
      <input class="phone-input" id="phoneInput" type="text" inputmode="numeric" autocomplete="off" placeholder="731 399 865" />
      <div class="sheet-actions">
        <button class="secondary" id="cancelEditBtn" type="button">Отмена</button>
        <button class="primary" id="saveEditBtn" type="button">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const video = document.getElementById("video");
    const cameraPlaceholder = document.getElementById("cameraPlaceholder");
    const scanBand = document.getElementById("scanBand");
    const statusEl = document.getElementById("status");
    const cameraBtn = document.getElementById("cameraBtn");
    const modePill = document.getElementById("modePill");
    const counterEl = document.getElementById("counter");
    const numbersList = document.getElementById("numbersList");
    const manualBtn = document.getElementById("manualBtn");
    const clearBtn = document.getElementById("clearBtn");
    const sendBtn = document.getElementById("sendBtn");
    const editSheet = document.getElementById("editSheet");
    const sheetTitle = document.getElementById("sheetTitle");
    const phoneInput = document.getElementById("phoneInput");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const saveEditBtn = document.getElementById("saveEditBtn");

    const SCAN_INTERVAL_MS = 1400;

    let stream = null;
    let scanTimer = null;
    let isRecognizing = false;
    let phones = [];
    let editIndex = null;

    function setStatus(text) {
      statusEl.textContent = text || "";
    }

    function digitsOnly(value) {
      return String(value || "").replace(/\D/g, "");
    }

    function normalizePhone(value) {
      let digits = digitsOnly(value);
      if (digits.startsWith("48") && digits.length === 11) {
        digits = digits.slice(2);
      }
      return digits.length === 9 ? digits : null;
    }

    function formatPhone(digits) {
      const d = normalizePhone(digits) || digitsOnly(digits);
      if (d.length !== 9) return d;
      return `${d.slice(0, 3)} ${d.slice(3, 6)} ${d.slice(6)}`;
    }

    function vibrate(ms = 35) {
      try {
        if (navigator.vibrate) navigator.vibrate(ms);
      } catch (_) {}
    }

    function addPhone(value, source = "manual") {
      const phone = normalizePhone(value);
      if (!phone) {
        setStatus("Нужен номер ровно из 9 цифр");
        return false;
      }

      if (phones.includes(phone)) {
        setStatus(`Уже есть: ${formatPhone(phone)}`);
        return false;
      }

      phones.push(phone);
      setStatus(`Добавлен: ${formatPhone(phone)}`);
      if (source === "scan") vibrate();
      renderPhones();
      return true;
    }

    function renderPhones() {
      numbersList.innerHTML = "";
      counterEl.textContent = `${phones.length} ${plural(phones.length, "номер", "номера", "номеров")}`;
      sendBtn.disabled = phones.length === 0;
      clearBtn.disabled = phones.length === 0;

      if (phones.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Номера появятся здесь. Их можно удалить, изменить или добавить вручную.";
        numbersList.appendChild(empty);
        return;
      }

      phones.forEach((phone, index) => {
        const card = document.createElement("div");
        card.className = "phone-card";

        const idx = document.createElement("div");
        idx.className = "phone-index";
        idx.textContent = String(index + 1);

        const number = document.createElement("div");
        number.className = "phone-number";
        number.textContent = formatPhone(phone);

        const editBtn = document.createElement("button");
        editBtn.className = "icon-btn";
        editBtn.type = "button";
        editBtn.textContent = "✏️";
        editBtn.addEventListener("click", () => openSheet(index));

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "icon-btn danger";
        deleteBtn.type = "button";
        deleteBtn.textContent = "🗑";
        deleteBtn.addEventListener("click", () => {
          const removed = phones[index];
          phones.splice(index, 1);
          setStatus(`Удалён: ${formatPhone(removed)}`);
          renderPhones();
        });

        card.appendChild(idx);
        card.appendChild(number);
        card.appendChild(editBtn);
        card.appendChild(deleteBtn);
        numbersList.appendChild(card);
      });
    }

    function plural(n, one, few, many) {
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return one;
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
      return many;
    }

    function openSheet(index = null) {
      editIndex = index;
      sheetTitle.textContent = index === null ? "Добавить номер" : "Редактировать номер";
      phoneInput.value = index === null ? "" : formatPhone(phones[index]);
      editSheet.classList.add("visible");
      setTimeout(() => {
        phoneInput.focus();
        phoneInput.select();
      }, 50);
    }

    function closeSheet() {
      editIndex = null;
      editSheet.classList.remove("visible");
    }

    phoneInput.addEventListener("input", () => {
      const d = digitsOnly(phoneInput.value).slice(0, 11);
      if (d.startsWith("48") && d.length > 2) {
        phoneInput.value = formatPhone(d.slice(2));
      } else if (d.length <= 9) {
        phoneInput.value = formatPhone(d);
      } else {
        phoneInput.value = d;
      }
    });

    manualBtn.addEventListener("click", () => openSheet(null));
    cancelEditBtn.addEventListener("click", closeSheet);

    saveEditBtn.addEventListener("click", () => {
      const phone = normalizePhone(phoneInput.value);
      if (!phone) {
        setStatus("Нужно ввести ровно 9 цифр");
        return;
      }

      const duplicateIndex = phones.findIndex((p, i) => p === phone && i !== editIndex);
      if (duplicateIndex !== -1) {
        setStatus(`Такой номер уже есть: ${formatPhone(phone)}`);
        return;
      }

      if (editIndex === null) {
        phones.push(phone);
        setStatus(`Добавлен вручную: ${formatPhone(phone)}`);
      } else {
        phones[editIndex] = phone;
        setStatus(`Обновлён: ${formatPhone(phone)}`);
      }

      closeSheet();
      renderPhones();
    });

    clearBtn.addEventListener("click", () => {
      if (!phones.length) return;
      phones = [];
      setStatus("Список очищен");
      renderPhones();
    });

    sendBtn.addEventListener("click", () => {
      if (!phones.length) {
        setStatus("Нет номеров для отправки");
        return;
      }

      const payload = JSON.stringify(phones); // чистые номера без пробелов

      if (tg?.sendData) {
        tg.sendData(payload);
        tg.close();
      } else {
        setStatus("Открой через Telegram, чтобы отправить номера в чат");
        console.log(payload);
      }
    });

    async function startCamera() {
      if (stream) {
        startAutoScan();
        return;
      }

      setStatus("Запрашиваю доступ к камере...");
      cameraBtn.disabled = true;

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        cameraPlaceholder.classList.add("hidden");
        scanBand.classList.add("active");
        setStatus("Камера включена. Авто-сканирование активно");
        startAutoScan();
      } catch (err) {
        console.error(err);
        setStatus("Нет доступа к камере. Разреши камеру в Telegram/браузере");
        if (tg?.showAlert) tg.showAlert("Нет доступа к камере. Разреши камеру в Telegram/браузере.");
      } finally {
        cameraBtn.disabled = false;
      }
    }

    function stopAutoScan() {
      if (scanTimer) clearInterval(scanTimer);
      scanTimer = null;
      modePill.textContent = "пауза";
      cameraBtn.textContent = "▶️";
      setStatus("Авто-сканирование на паузе");
    }

    function startAutoScan() {
      if (scanTimer) return;
      modePill.textContent = "авто";
      cameraBtn.textContent = "⏸";
      setStatus("Авто-сканирование активно");
      scanFrame();
      scanTimer = setInterval(scanFrame, SCAN_INTERVAL_MS);
    }

    cameraBtn.addEventListener("click", () => {
      if (!stream) {
        startCamera();
        return;
      }
      if (scanTimer) stopAutoScan();
      else startAutoScan();
    });

    function extractPhonesFromText(text) {
      const cleanText = String(text || "")
        .replace(/[|]/g, " ")
        .replace(/\s+/g, " ");

      const lines = String(text || "")
        .split(/\n+/)
        .map((line) => line.trim())
        .filter(Boolean);

      const candidates = [];

      function collectFrom(str, scoreBonus = 0) {
        // Не вытаскиваем 9 цифр изнутри длинного barcode/ICCID.
        // Подходит: 731399865, 731 399 865, 731-399-865, +48 731 399 865.
        const re = /(^|[^\d])(?:\+?48[\s\-.]*)?(\d{3})[\s\-.]*(\d{3})[\s\-.]*(\d{3})(?!\d)/g;
        let match;
        while ((match = re.exec(str)) !== null) {
          const phone = `${match[2]}${match[3]}${match[4]}`;
          if (phone.length === 9) {
            candidates.push({ phone, score: scoreBonus });
          }
        }
      }

      for (const line of lines) {
        const lower = line.toLowerCase();
        const digitCount = digitsOnly(line).length;
        const hasPhoneLabel = lower.includes("phone") || lower.includes("telefon") || lower.includes("numer");
        const score = hasPhoneLabel ? 10 : 0;

        // Если в строке только длинный barcode, пропускаем.
        if (digitCount > 12 && !hasPhoneLabel) continue;
        collectFrom(line, score);
      }

      collectFrom(cleanText, 0);

      const unique = [];
      const seen = new Set();
      candidates
        .sort((a, b) => b.score - a.score)
        .forEach((item) => {
          if (!seen.has(item.phone)) {
            seen.add(item.phone);
            unique.push(item.phone);
          }
        });

      return unique;
    }

    function makeScanCanvas() {
      if (!video.videoWidth || !video.videoHeight) return null;

      const source = document.createElement("canvas");
      source.width = video.videoWidth;
      source.height = video.videoHeight;
      const sctx = source.getContext("2d", { willReadFrequently: true });
      sctx.drawImage(video, 0, 0, source.width, source.height);

      // Центральная область, где обычно лежит карточка с номером.
      // Без видимой инструкции «наводи в рамку», но OCR не читает весь кадр с лишним мусором.
      const cropX = source.width * 0.04;
      const cropY = source.height * 0.25;
      const cropW = source.width * 0.92;
      const cropH = source.height * 0.45;

      const crop = document.createElement("canvas");
      crop.width = Math.max(1, Math.floor(cropW));
      crop.height = Math.max(1, Math.floor(cropH));
      const cctx = crop.getContext("2d", { willReadFrequently: true });
      cctx.drawImage(source, cropX, cropY, cropW, cropH, 0, 0, crop.width, crop.height);

      return crop;
    }

    async function scanFrame() {
      if (isRecognizing || !stream || !video.videoWidth) return;
      const canvas = makeScanCanvas();
      if (!canvas) return;

      isRecognizing = true;
      modePill.textContent = "читаю...";

      try {
        const result = await Tesseract.recognize(canvas, "eng", {
          logger: () => {}
        });

        const text = result?.data?.text || "";
        const found = extractPhonesFromText(text);

        if (found.length) {
          let added = 0;
          found.forEach((phone) => {
            if (addPhone(phone, "scan")) added += 1;
          });
          if (!added) setStatus("Найденный номер уже есть в списке");
        } else if (!phones.length) {
          setStatus("Сканирую... номера пока нет");
        } else {
          setStatus(`Сканирую... найдено ${phones.length}`);
        }
      } catch (err) {
        console.error(err);
        setStatus("Ошибка OCR. Можно добавить номер вручную");
      } finally {
        isRecognizing = false;
        if (scanTimer) modePill.textContent = "авто";
      }
    }

    renderPhones();
  </script>
</body>
</html>
