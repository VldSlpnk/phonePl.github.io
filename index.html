<!DOCTYPE html>
<html lang="ru">
   <head>
      <meta charset="UTF-8" />
      <title>Сканер номера</title>
      <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

      <script src="https://telegram.org/js/telegram-web-app.js"></script>
      <script src="https://unpkg.com/tesseract.js@5.0.0/dist/tesseract.min.js"></script>

      <style>
         * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
         }

         html,
         body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         }

         body {
            position: relative;
         }

         #video-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            background: #000;
         }

         video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
         }

         #empty-screen {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            text-align: center;
            background: radial-gradient(circle at top, #12213f 0%, #02040a 65%);
         }

         #empty-screen-inner {
            max-width: 330px;
            opacity: 0.95;
         }

         #empty-screen-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
         }

         #empty-screen-text {
            font-size: 15px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.72);
         }

         #frame {
            position: absolute;
            z-index: 10;
            border: 3px solid #31a8ff;
            border-radius: 18px;
            pointer-events: auto;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.12);
         }

         #frame.hidden {
            display: none;
         }

         #frame-resize-handle {
            position: absolute;
            width: 28px;
            height: 28px;
            right: -14px;
            bottom: -14px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: #31a8ff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            cursor: nwse-resize;
            touch-action: none;
         }

         #status-chip {
            position: fixed;
            top: calc(14px + env(safe-area-inset-top));
            left: 14px;
            right: 14px;
            z-index: 30;
            min-height: 44px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            border-radius: 999px;
            background: rgba(12, 20, 42, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            font-size: 15px;
            line-height: 1.25;
         }

         #camera-btn {
            position: fixed;
            right: 18px;
            bottom: calc(205px + env(safe-area-inset-bottom));
            z-index: 45;
            width: 74px;
            height: 74px;
            border-radius: 24px;
            border: none;
            background: linear-gradient(180deg, #40c4ff, #1296f3);
            color: #fff;
            font-size: 30px;
            font-weight: 800;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
         }

         #camera-btn:disabled {
            opacity: 0.65;
         }

         #controls {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: calc(12px + env(safe-area-inset-bottom));
            z-index: 40;
            max-height: 40vh;
            padding: 14px;
            border-radius: 24px;
            background: rgba(7, 17, 35, 0.86);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
         }

         #controls-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
         }

         #controls-title {
            font-size: 20px;
            line-height: 1.1;
            font-weight: 800;
         }

         #scan-mode-badge {
            flex-shrink: 0;
            padding: 7px 11px;
            border-radius: 999px;
            border: 1px solid rgba(49, 168, 255, 0.45);
            background: rgba(49, 168, 255, 0.12);
            color: #bde7ff;
            font-size: 13px;
            font-weight: 700;
         }

         #phones-list {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow-y: auto;
            min-height: 52px;
            max-height: 21vh;
         }

         #phones-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
         }

         #phones-list li.empty {
            color: rgba(255, 255, 255, 0.55);
            font-size: 15px;
            border-bottom: none;
         }

         .li-text {
            flex: 1;
            min-width: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.3px;
         }

         .li-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
         }

         .small-btn {
            padding: 8px 10px;
            font-size: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-weight: 700;
         }

         .small-btn.danger {
            color: #ff9a9a;
            border-color: rgba(255, 154, 154, 0.35);
         }

         .btn-row {
            display: flex;
            gap: 10px;
         }

         #add-manual-btn,
         #send-btn {
            flex: 1;
            padding: 14px 10px;
            border-radius: 16px;
            border: none;
            color: #fff;
            font-size: 15px;
            font-weight: 800;
         }

         #add-manual-btn {
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.14);
         }

         #send-btn {
            background: #0d8bff;
         }

         #send-btn:disabled {
            opacity: 0.45;
         }

         #edit-panel {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: calc(12px + env(safe-area-inset-bottom));
            z-index: 80;
            display: none;
            padding: 14px;
            border-radius: 22px;
            background: rgba(7, 17, 35, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
         }

         #edit-panel.visible {
            display: block;
         }

         #edit-panel-title {
            margin-bottom: 9px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.76);
         }

         #edit-input {
            width: 100%;
            padding: 13px;
            margin-bottom: 10px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            outline: none;
         }

         #edit-buttons {
            display: flex;
            gap: 10px;
         }

         #edit-save-btn,
         #edit-cancel-btn {
            flex: 1;
            padding: 13px;
            border-radius: 15px;
            border: none;
            color: #fff;
            font-size: 15px;
            font-weight: 800;
         }

         #edit-save-btn {
            background: #00b894;
         }

         #edit-cancel-btn {
            background: #58606b;
         }

         @media (max-height: 700px) {
            #controls {
               max-height: 36vh;
            }

            #phones-list {
               max-height: 16vh;
            }

            #camera-btn {
               width: 62px;
               height: 62px;
               border-radius: 20px;
               font-size: 25px;
               bottom: calc(185px + env(safe-area-inset-bottom));
            }

            #controls-title {
               font-size: 18px;
            }
         }
      </style>
   </head>

   <body>
      <div id="video-container">
         <video id="video" autoplay playsinline muted></video>

         <div id="empty-screen">
            <div id="empty-screen-inner">
               <div id="empty-screen-title">Сканер номеров</div>
               <div id="empty-screen-text">
                  Камера откроется автоматически. Номера будут добавляться сами.
                  На экране они будут с пробелами, а в чат уйдут без пробелов.
               </div>
            </div>
         </div>

         <div id="frame" class="hidden">
            <div id="frame-resize-handle"></div>
         </div>
      </div>

      <div id="status-chip">Открываю камеру...</div>

      <button id="camera-btn" type="button">📷</button>

      <div id="controls">
         <div id="controls-header">
            <div id="controls-title">Отсканированные номера</div>
            <div id="scan-mode-badge">авто</div>
         </div>

         <ul id="phones-list"></ul>

         <div class="btn-row">
            <button id="add-manual-btn" type="button">+ Вручную</button>
            <button id="send-btn" type="button" disabled>Отправить</button>
         </div>
      </div>

      <div id="edit-panel">
         <div id="edit-panel-title">Номер телефона — ровно 9 цифр</div>
         <input id="edit-input" type="text" inputmode="numeric" autocomplete="off" />
         <div id="edit-buttons">
            <button id="edit-save-btn" type="button">Сохранить</button>
            <button id="edit-cancel-btn" type="button">Отмена</button>
         </div>
      </div>

      <script>
         const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

         if (tg) {
            tg.ready();
            tg.expand();
         }

         const videoContainer = document.getElementById("video-container");
         const video = document.getElementById("video");
         const emptyScreen = document.getElementById("empty-screen");
         const frame = document.getElementById("frame");
         const frameHandle = document.getElementById("frame-resize-handle");

         const statusChip = document.getElementById("status-chip");
         const cameraBtn = document.getElementById("camera-btn");
         const scanModeBadge = document.getElementById("scan-mode-badge");

         const phonesListEl = document.getElementById("phones-list");
         const addManualBtn = document.getElementById("add-manual-btn");
         const sendBtn = document.getElementById("send-btn");

         const editPanel = document.getElementById("edit-panel");
         const editInput = document.getElementById("edit-input");
         const editSaveBtn = document.getElementById("edit-save-btn");
         const editCancelBtn = document.getElementById("edit-cancel-btn");

         let scannedPhones = [];
         let editingIndex = null;

         let stream = null;
         let cameraStarting = false;
         let autoScanEnabled = false;
         let scanTimer = null;
         let scanBusy = false;

         let worker = null;
         let workerReady = false;
         let workerPromise = null;

         let frameInitialized = false;

         function setStatus(message) {
            statusChip.textContent = message || "";
         }

         function onlyDigits(value) {
            return String(value || "").replace(/\D/g, "");
         }

         function toNineDigits(value) {
            let digits = onlyDigits(value);

            if (digits.length === 11 && digits.startsWith("48")) {
               digits = digits.slice(2);
            }

            if (digits.length !== 9) return null;
            return digits;
         }

         function formatPhone(digits) {
            const d = onlyDigits(digits).slice(0, 9);
            if (d.length <= 3) return d;
            if (d.length <= 6) return `${d.slice(0, 3)} ${d.slice(3)}`;
            return `${d.slice(0, 3)} ${d.slice(3, 6)} ${d.slice(6, 9)}`;
         }

         function scrollPhonesListToBottom() {
            requestAnimationFrame(() => {
               const maxScrollTop = phonesListEl.scrollHeight;

               if (typeof phonesListEl.scrollTo === "function") {
                  phonesListEl.scrollTo({
                     top: maxScrollTop,
                     behavior: "smooth",
                  });
               } else {
                  phonesListEl.scrollTop = maxScrollTop;
               }
            });
         }

         function renderPhonesList(options = {}) {
            const shouldScrollToLast = Boolean(options.scrollToLast);

            phonesListEl.innerHTML = "";
            sendBtn.disabled = scannedPhones.length === 0;

            if (!scannedPhones.length) {
               const li = document.createElement("li");
               li.className = "empty";
               li.textContent = "Номеров пока нет";
               phonesListEl.appendChild(li);
               return;
            }

            scannedPhones.forEach((phone, index) => {
               const li = document.createElement("li");

               const text = document.createElement("span");
               text.className = "li-text";
               text.textContent = `${index + 1}. ${formatPhone(phone)}`;

               const actions = document.createElement("span");
               actions.className = "li-actions";

               const editBtn = document.createElement("button");
               editBtn.type = "button";
               editBtn.className = "small-btn";
               editBtn.textContent = "✏️";
               editBtn.addEventListener("click", () => openEditPanel(index));

               const deleteBtn = document.createElement("button");
               deleteBtn.type = "button";
               deleteBtn.className = "small-btn danger";
               deleteBtn.textContent = "🗑️";
               deleteBtn.addEventListener("click", () => {
                  const deleted = scannedPhones[index];
                  scannedPhones.splice(index, 1);
                  setStatus(`Удалён: ${formatPhone(deleted)}`);
                  renderPhonesList();
               });

               actions.appendChild(editBtn);
               actions.appendChild(deleteBtn);
               li.appendChild(text);
               li.appendChild(actions);
               phonesListEl.appendChild(li);
            });

            if (shouldScrollToLast) {
               scrollPhonesListToBottom();
            }
         }

         function addPhone(phoneDigits) {
            const digits = toNineDigits(phoneDigits);
            if (!digits) return false;

            if (scannedPhones.includes(digits)) {
               setStatus(`Уже есть: ${formatPhone(digits)}`);
               return false;
            }

            scannedPhones.push(digits);
            renderPhonesList({ scrollToLast: true });

            if (navigator.vibrate) {
               navigator.vibrate(60);
            }

            setStatus(`Добавлен: ${formatPhone(digits)}`);
            return true;
         }

         function openEditPanel(index) {
            editingIndex = index;

            if (index === -1) {
               editInput.value = "";
            } else {
               editInput.value = formatPhone(scannedPhones[index]);
            }

            editPanel.classList.add("visible");

            setTimeout(() => {
               editInput.focus();
               editInput.select();
            }, 50);
         }

         function closeEditPanel() {
            editingIndex = null;
            editPanel.classList.remove("visible");
         }

         addManualBtn.addEventListener("click", () => {
            openEditPanel(-1);
         });

         editCancelBtn.addEventListener("click", () => {
            closeEditPanel();
         });

         editSaveBtn.addEventListener("click", () => {
            const digits = toNineDigits(editInput.value);

            if (!digits) {
               setStatus("Нужно ввести ровно 9 цифр");
               return;
            }

            if (editingIndex === -1) {
               addPhone(digits);
               closeEditPanel();
               return;
            }

            if (editingIndex !== null) {
               const duplicateIndex = scannedPhones.findIndex((p, idx) => {
                  return p === digits && idx !== editingIndex;
               });

               if (duplicateIndex !== -1) {
                  setStatus(`Такой номер уже есть: ${formatPhone(digits)}`);
                  return;
               }

               scannedPhones[editingIndex] = digits;
               setStatus(`Обновлён: ${formatPhone(digits)}`);
               renderPhonesList();
               closeEditPanel();
            }
         });

         editInput.addEventListener("input", () => {
            const digits = onlyDigits(editInput.value).slice(0, 11);
            editInput.value = formatPhone(digits.length === 11 && digits.startsWith("48") ? digits.slice(2) : digits);
         });

         function initFrame(force = false) {
            if (frameInitialized && !force) return;

            const rect = videoContainer.getBoundingClientRect();
            const width = rect.width * 0.84;
            const height = rect.height * 0.12;

            frame.style.width = `${width}px`;
            frame.style.height = `${height}px`;
            frame.style.left = `${(rect.width - width) / 2}px`;
            const centerY = rect.height * 0.30;
            frame.style.top = `${centerY - height / 2}px`;

            frameInitialized = true;
         }

         window.addEventListener("resize", () => {
            if (stream) {
               initFrame(true);
            }
         });

         let isResizing = false;
         let startX = 0;
         let startY = 0;
         let startWidth = 0;
         let startHeight = 0;
         let centerX = 0;
         let centerY = 0;

         function getClientXY(event) {
            if (event.touches && event.touches[0]) {
               return {
                  x: event.touches[0].clientX,
                  y: event.touches[0].clientY,
               };
            }

            return {
               x: event.clientX,
               y: event.clientY,
            };
         }

         function startResize(event) {
            event.preventDefault();
            event.stopPropagation();

            isResizing = true;

            const frameRect = frame.getBoundingClientRect();
            const containerRect = videoContainer.getBoundingClientRect();

            startWidth = frameRect.width;
            startHeight = frameRect.height;

            centerX = frameRect.left - containerRect.left + frameRect.width / 2;
            centerY = frameRect.top - containerRect.top + frameRect.height / 2;

            const pos = getClientXY(event);
            startX = pos.x;
            startY = pos.y;
         }

         function onResize(event) {
            if (!isResizing) return;

            event.preventDefault();

            const pos = getClientXY(event);
            const dx = pos.x - startX;
            const dy = pos.y - startY;

            const containerRect = videoContainer.getBoundingClientRect();

            let newWidth = startWidth + dx;
            let newHeight = startHeight + dy;

            const minWidth = containerRect.width * 0.35;
            const minHeight = containerRect.height * 0.08;
            const maxWidth = containerRect.width * 0.96;
            const maxHeight = containerRect.height * 0.58;

            newWidth = Math.max(minWidth, Math.min(maxWidth, newWidth));
            newHeight = Math.max(minHeight, Math.min(maxHeight, newHeight));

            frame.style.width = `${newWidth}px`;
            frame.style.height = `${newHeight}px`;
            frame.style.left = `${centerX - newWidth / 2}px`;
            frame.style.top = `${centerY - newHeight / 2}px`;
         }

         function stopResize() {
            isResizing = false;
         }

         frameHandle.addEventListener("mousedown", startResize);
         frameHandle.addEventListener("touchstart", startResize, { passive: false });

         window.addEventListener("mousemove", onResize);
         window.addEventListener("touchmove", onResize, { passive: false });

         window.addEventListener("mouseup", stopResize);
         window.addEventListener("touchend", stopResize);
         window.addEventListener("touchcancel", stopResize);

         async function ensureWorker() {
            if (workerReady && worker) return worker;
            if (workerPromise) return workerPromise;

            setStatus("Подготавливаю распознавание...");

            workerPromise = (async () => {
               const createdWorker = await Tesseract.createWorker("eng");

               await createdWorker.setParameters({
                  tessedit_char_whitelist: "0123456789 +-.()",
               });

               worker = createdWorker;
               workerReady = true;

               return worker;
            })();

            try {
               return await workerPromise;
            } catch (error) {
               console.error("OCR init error:", error);
               workerPromise = null;
               worker = null;
               workerReady = false;
               throw error;
            }
         }

         function extractPhonesFromText(text) {
            const rawText = String(text || "")
               .replace(/[^\S\r\n]+/g, " ")
               .replace(/[|]/g, "1");

            console.log("OCR text:", rawText);

            const lines = rawText
               .split(/\r?\n/)
               .map((line) => line.trim())
               .filter(Boolean);

            const result = new Set();
            const phoneKeyword = /(numer|telefon|phone|number)/i;

            function addFromChunk(chunk) {
               const spacedPattern = /(?:^|[^\d])(?:\+?48[\s.\-]*)?(\d{3})[\s.\-]+(\d{3})[\s.\-]+(\d{3})(?!\d)/g;
               const compactPattern = /(?:^|[^\d])(?:\+?48[\s.\-]*)?(\d{9})(?!\d)/g;

               let match;

               while ((match = spacedPattern.exec(chunk)) !== null) {
                  const digits = `${match[1]}${match[2]}${match[3]}`;
                  if (digits.length === 9) result.add(digits);
               }

               while ((match = compactPattern.exec(chunk)) !== null) {
                  const digits = match[1];
                  if (digits.length === 9) result.add(digits);
               }
            }

            for (let i = 0; i < lines.length; i++) {
               for (let size = 1; size <= 3; size++) {
                  const chunk = lines.slice(i, i + size).join(" ");
                  const digitsCount = onlyDigits(chunk).length;
                  const hasKeyword = phoneKeyword.test(chunk);

                  if (!digitsCount) continue;

                  if (digitsCount <= 11 || hasKeyword) {
                     addFromChunk(chunk);
                  }
               }
            }

            return Array.from(result);
         }

         function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
         }

         function getCropCanvasFromFrame() {
            const videoRect = video.getBoundingClientRect();
            const frameRect = frame.getBoundingClientRect();

            const videoW = video.videoWidth;
            const videoH = video.videoHeight;

            const videoAspect = videoW / videoH;
            const rectAspect = videoRect.width / videoRect.height;

            let renderedW;
            let renderedH;
            let offsetX;
            let offsetY;

            if (videoAspect > rectAspect) {
               renderedH = videoRect.height;
               renderedW = renderedH * videoAspect;
               offsetX = (videoRect.width - renderedW) / 2;
               offsetY = 0;
            } else {
               renderedW = videoRect.width;
               renderedH = renderedW / videoAspect;
               offsetX = 0;
               offsetY = (videoRect.height - renderedH) / 2;
            }

            const xInRendered = frameRect.left - videoRect.left - offsetX;
            const yInRendered = frameRect.top - videoRect.top - offsetY;

            let sx = (xInRendered / renderedW) * videoW;
            let sy = (yInRendered / renderedH) * videoH;
            let sw = (frameRect.width / renderedW) * videoW;
            let sh = (frameRect.height / renderedH) * videoH;

            sx = clamp(sx, 0, videoW - 1);
            sy = clamp(sy, 0, videoH - 1);
            sw = clamp(sw, 20, videoW - sx);
            sh = clamp(sh, 20, videoH - sy);

            const cropCanvas = document.createElement("canvas");
            cropCanvas.width = Math.floor(sw);
            cropCanvas.height = Math.floor(sh);

            const ctx = cropCanvas.getContext("2d", { willReadFrequently: true });
            ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cropCanvas.width, cropCanvas.height);

            return cropCanvas;
         }

         async function runOCROnce() {
            if (!autoScanEnabled || scanBusy || !stream) return;

            if (!video.videoWidth || !video.videoHeight) {
               setStatus("Камера ещё загружается...");
               return;
            }

            scanBusy = true;

            try {
               const currentCount = scannedPhones.length;
               setStatus(currentCount ? `Сканирую... найдено: ${currentCount}` : "Сканирую... номера пока нет");

               const activeWorker = await ensureWorker();
               const cropCanvas = getCropCanvasFromFrame();

               const result = await activeWorker.recognize(cropCanvas);
               const text = result && result.data ? result.data.text : "";
               const phones = extractPhonesFromText(text);

               let added = 0;

               phones.forEach((phone) => {
                  if (addPhone(phone)) {
                     added += 1;
                  }
               });

               if (!added && autoScanEnabled) {
                  setStatus(scannedPhones.length ? `Сканирую... найдено: ${scannedPhones.length}` : "Сканирую... номера пока нет");
               }
            } catch (error) {
               console.error(error);
               setStatus("Ошибка распознавания. Попробуй ещё раз.");
            } finally {
               scanBusy = false;
            }
         }

         function startAutoScan() {
            if (!stream) return;

            autoScanEnabled = true;
            cameraBtn.textContent = "⏸️";
            scanModeBadge.textContent = "авто";
            setStatus("Сканирую... номера пока нет");

            if (scanTimer) {
               clearInterval(scanTimer);
            }

            runOCROnce();
            scanTimer = setInterval(runOCROnce, 1300);
         }

         function pauseAutoScan() {
            autoScanEnabled = false;
            cameraBtn.textContent = "▶️";
            scanModeBadge.textContent = "пауза";

            if (scanTimer) {
               clearInterval(scanTimer);
               scanTimer = null;
            }

            setStatus("Сканирование на паузе");
         }

         async function startCamera() {
            if (cameraStarting || stream) return;

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
               setStatus("Камера недоступна в этом браузере");
               return;
            }

            cameraStarting = true;
            cameraBtn.disabled = true;
            setStatus("Запрашиваю доступ к камере...");

            try {
               stream = await navigator.mediaDevices.getUserMedia({
                  audio: false,
                  video: {
                     facingMode: { ideal: "environment" },
                     width: { ideal: 1280 },
                     height: { ideal: 720 },
                  },
               });

               video.srcObject = stream;
               await video.play();

               emptyScreen.style.display = "none";
               frame.classList.remove("hidden");
               initFrame(true);

               cameraBtn.disabled = false;
               cameraStarting = false;
               startAutoScan();
            } catch (error) {
               console.error(error);
               cameraStarting = false;
               cameraBtn.disabled = false;
               setStatus("Не удалось открыть камеру. Разреши доступ в Telegram/браузере.");

               if (tg && tg.showAlert) {
                  tg.showAlert("Не удалось открыть камеру. Проверь разрешение камеры.");
               }
            }
         }

         cameraBtn.addEventListener("click", async () => {
            if (!stream) {
               await startCamera();
               return;
            }

            if (autoScanEnabled) {
               pauseAutoScan();
            } else {
               startAutoScan();
            }
         });

         sendBtn.addEventListener("click", () => {
            if (!scannedPhones.length) {
               setStatus("Нет номеров для отправки");
               return;
            }

            const payload = JSON.stringify(scannedPhones);

            if (tg && tg.sendData) {
               tg.sendData(payload);
               tg.close();
            } else {
               alert(scannedPhones.join("\n"));
            }
         });

         renderPhonesList();

         setTimeout(() => {
            ensureWorker()
               .then(() => {
                  if (!stream && !autoScanEnabled && !cameraStarting) {
                     setStatus("OCR готов. Открываю камеру...");
                  }
               })
               .catch(() => {
                  if (!stream && !autoScanEnabled && !cameraStarting) {
                     setStatus("OCR загрузится при первом скане. Открываю камеру...");
                  }
               });
         }, 200);

         setTimeout(() => {
            startCamera();
         }, 350);
      </script>
   </body>
</html>
